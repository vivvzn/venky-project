<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>CSS Box Model</title>
  <style>
    .box {
      width: 200px;
      height: 200px;
    }

    /* 1st box: 20px padding, 10px black border */
    .box-1 {
      background-color: cadetblue;
      padding: 20px;
      border: 10px solid black;
    }

    .box-1 p {
      margin: 0;
    }

    /* 2nd box: 20px top/bottom, 10px left/right border.
       margin-left = width of box 1 (200 + 2*20 padding + 2*10 border = 260) so the corners touch */
    .box-2 {
      background-color: gold;
      border-style: solid;
      border-color: black;
      border-width: 20px 10px;
      margin-left: 260px;
    }

    /* 3rd box: 10px border, its top-right corner touches box 2's bottom-left corner
       (260px - its own 220px width = 40px) */
    .box-3 {
      background-color: indianred;
      border: 10px solid black;
      margin-left: 40px;
    }

  </style>
</head>

<body>

  <div class="box box-1">
    <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Aliquam at sapien porttitor urna elementum lacinia. In
      id magna pulvinar, ultricies lorem id, vehicula elit. Aliquam eu luctus nisl, vitae pellentesque magna.
      Phasellus dolor metus, laoreet ac convallis sit amet, efficitur sed dolor.</p>
  </div>
  <div class="box box-2"></div>
  <div class="box box-3"></div>
